<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Kitty Interactiva 🎀</title>
    <style>
        /* --- CONFIGURACIÓN GENERAL --- */
        :root {
            --bg-principal: #f3d5dc; /* Fondo rosa suave como el de tu pantalla */
            --rosa-mono: #ff8fa3;
            --rosa-mono-oscuro: #ff4d6d;
            --borde-kitty: #2b2b2b;
            --fuente: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--fuente);
            background-color: var(--bg-principal);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        /* --- CONTENEDOR GRANDE --- */
        .contenedor-principal {
            background-color: #ffffff;
            width: 100%;
            max-width: 650px;
            height: 85vh;
            max-height: 680px;
            border-radius: 32px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 30px;
            border: 4px solid #fff;
        }

        .estado-texto {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--rosa-mono-oscuro);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            min-height: 35px;
            text-align: center;
        }

        /* --- PANTALLA DE JUEGO --- */
        .escenario {
            flex-grow: 1;
            width: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #ffffff 40%, #fff5f7 100%);
            border-radius: 20px;
            overflow: hidden;
        }

        /* --- DIBUJO VECTORIAL DE HELLO KITTY (EN GRANDE) --- */
        .kitty-cuerpo {
            position: relative;
            width: 280px;
            height: 220px;
            transition: all 0.5s ease;
        }

        /* Animación base de respiración física */
        .animacion-normal {
            animation: respirar 3s ease-in-out infinite;
        }

        /* Cabeza */
        .kitty-cabeza {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            border: 7px solid var(--borde-kitty);
            border-radius: 140px / 110px;
            z-index: 2;
        }

        /* Oreja Izquierda */
        .oreja-izq {
            position: absolute;
            top: -15px;
            left: 15px;
            width: 75px;
            height: 75px;
            background-color: #ffffff;
            border: 7px solid var(--borde-kitty);
            border-radius: 25px 0 0 0;
            transform: rotate(-12deg) skewX(-15deg);
            border-bottom: none;
            border-right: none;
            z-index: 1;
        }

        /* Oreja Derecha */
        .oreja-der {
            position: absolute;
            top: -15px;
            right: 15px;
            width: 75px;
            height: 75px;
            background-color: #ffffff;
            border: 7px solid var(--borde-kitty);
            border-radius: 0 25px 0 0;
            transform: rotate(12deg) skewX(15deg);
            border-bottom: none;
            border-left: none;
            z-index: 1;
        }

        /* Los Ojos Redondos */
        .ojo {
            position: absolute;
            top: 105px;
            width: 17px;
            height: 24px;
            background-color: var(--borde-kitty);
            border-radius: 50%;
            transition: all 0.2s ease;
        }

        .ojo.izq { left: 65px; }
        .ojo.der { right: 65px; }

        /* Nariz Amarilla */
        .nariz {
            position: absolute;
            top: 124px;
            left: 50%;
            transform: translateX(-50%);
            width: 22px;
            height: 16px;
            background-color: #ffea00;
            border: 5px solid var(--borde-kitty);
            border-radius: 50%;
        }

        /* Bigotes clásicos */
        .bigote {
            position: absolute;
            width: 35px;
            height: 6px;
            background-color: var(--borde-kitty);
            border-radius: 3px;
        }

        /* Bigotes Izquierdos */
        .b-izq1 { top: 115px; left: -15px; transform: rotate(10deg); }
        .b-izq2 { top: 130px; left: -20px; transform: rotate(0deg); }
        .b-izq3 { top: 145px; left: -15px; transform: rotate(-10deg); }

        /* Bigotes Derechos */
        .b-der1 { top: 115px; right: -15px; transform: rotate(-10deg); }
        .b-der2 { top: 130px; right: -20px; transform: rotate(0deg); }
        .b-der3 { top: 145px; right: -15px; transform: rotate(10deg); }

        /* --- EL FAMOSO MOÑO ROSA --- */
        .mono-contenedor {
            position: absolute;
            top: -10px;
            right: 15px;
            z-index: 3;
            transform: rotate(15deg);
        }

        .mono-centro {
            width: 42px;
            height: 42px;
            background-color: var(--rosa-mono);
            border: 6px solid var(--borde-kitty);
            border-radius: 50%;
            position: relative;
            z-index: 2;
        }

        .mono-lado {
            position: absolute;
            width: 55px;
            height: 50px;
            background-color: var(--rosa-mono);
            border: 6px solid var(--borde-kitty);
            border-radius: 18px;
            top: -4px;
        }

        .mono-lado.izq { left: -42px; transform: rotate(-15deg); }
        .mono-lado.der { right: -42px; transform: rotate(15deg); }

        /* --- INTERFAZ DE BOTONES --- */
        .zona-botones {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 15px;
        }

        .btn {
            background-color: #fff0f3;
            color: var(--rosa-mono-oscuro);
            border: 3px solid var(--rosa-mono-oscuro);
            padding: 14px;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 5px 0 var(--rosa-mono-oscuro);
        }

        .btn:hover {
            background-color: var(--rosa-mono-oscuro);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 7px 0 #c9184a;
        }

        .btn:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 transparent;
        }

        /* --- EFECTOS DE ACCIÓN --- */
        .efecto-visual {
            position: absolute;
            font-size: 3rem;
            pointer-events: none;
            animation: flotarEfecto 1.5s ease-out forwards;
            z-index: 10;
        }

        /* --- ANIMACIONES CSS --- */
        @keyframes respirar {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-6px) scale(1.02); }
        }

        @keyframes comer {
            0% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(5deg); }
            100% { transform: scale(1) rotate(-5deg); }
        }

        @keyframes bailar {
            0% { transform: translateX(-15px) rotate(-8deg); }
            100% { transform: translateX(15px) rotate(8deg); }
        }

        @keyframes flotarEfecto {
            0% { transform: translateY(30px) scale(0.5); opacity: 0; }
            30% { opacity: 1; }
            100% { transform: translateY(-120px) scale(1.4); opacity: 0; }
        }

        /* Estados de los ojos mediante JS */
        .ojos-dormidos {
            height: 6px !important;
            border-radius: 0 !important;
            top: 115px !important;
            background-color: transparent !important;
            border-top: 6px solid var(--borde-kitty);
        }

        .ojos-felices {
            height: 10px !important;
            background-color: transparent !important;
            border: 5px solid var(--borde-kitty);
            border-bottom: none;
            border-left: none;
            border-right: none;
            border-radius: 50% 50% 0 0;
            transform: scaleY(-1);
            top: 110px !important;
        }
    </style>
</head>
<body>

    <div class="contenedor-principal">
        <!-- Texto del estado superior -->
        <div class="estado-texto" id="status">¡Hola! Soy Hello Kitty 💕</div>

        <!-- Escenario de dibujo de Kitty -->
        <div class="escenario" id="escenario">
            <div class="kitty-cuerpo animacion-normal" id="kitty">
                
                <!-- Moño Rosa Completo -->
                <div class="mono-contenedor">
                    <div class="mono-lado izq"></div>
                    <div class="mono-centro"></div>
                    <div class="mono-lado der"></div>
                </div>

                <!-- Cabeza con todos sus elementos vectoriales -->
                <div class="kitty-cabeza">
                    <div class="oreja-izq"></div>
                    <div class="oreja-der"></div>
                    
                    <!-- Ojos -->
                    <div class="ojo izq" id="ojoIzq"></div>
                    <div class="ojo der" id="ojoDer"></div>
                    
                    <!-- Nariz -->
                    <div class="nariz"></div>

                    <!-- Bigotes Izquierdos -->
                    <div class="bigote b-izq1"></div>
                    <div class="bigote b-izq2"></div>
                    <div class="bigote b-izq3"></div>

                    <!-- Bigotes Derechos -->
                    <div class="bigote b-der1"></div>
                    <div class="bigote b-der2"></div>
                    <div class="bigote b-der3"></div>
                </div>

            </div>
        </div>

        <!-- Panel de control interactivo -->
        <div class="zona-botones">
            <button class="btn" onclick="interactuar('comer')">🍎 Alimentar</button>
            <button class="btn" onclick="interactuar('jugar')">🎈 Jugar</button>
            <button class="btn" onclick="interactuar('dormir')">⭐ Dormir</button>
        </div>
    </div>

    <script>
        const kitty = document.getElementById('kitty');
        const status = document.getElementById('status');
        const escenario = document.getElementById('escenario');
        const ojoIzq = document.getElementById('ojoIzq');
        const ojoDer = document.getElementById('ojoDer');

        let modoActual = null;

        function interactuar(accion) {
            // Limpiar clases previas de ojos y animaciones
            kitty.style.animation = "none";
            ojoIzq.className = "ojo izq";
            ojoDer.className = "ojo der";
            
            // Forzar reinicio de animación en el navegador
            void kitty.offsetWidth;

            if (accion === 'comer') {
                status.textContent = "¡Mmm, qué rico! 🍎✨";
                kitty.style.animation = "comer 0.5s ease infinite alternate";
                ojoIzq.classList.add('ojos-felices');
                ojoDer.classList.add('ojos-felices');
                lanzarEfecto('🍎');
                lanzarEfecto('✨');
                
                setTimeout(volverNormal, 3500);
            } 
            else if (accion === 'jugar') {
                status.textContent = "¡Yaaay, qué divertido! 🎈💕";
                kitty.style.animation = "bailar 0.4s ease-in-out infinite alternate";
                lanzarEfecto('🎈');
                lanzarEfecto('💖');
                
                setTimeout(volverNormal, 4000);
            } 
            else if (accion === 'dormir') {
                status.textContent = "Zzz... Buenas noches ⭐";
                kitty.style.animation = "respirar 4s ease-in-out infinite";
                ojoIzq.classList.add('ojos-dormidos');
                ojoDer.classList.add('ojos-dormidos');
                lanzarEfecto('💤');
                
                setTimeout(volverNormal, 5000);
            }
        }

        function volverNormal() {
            status.textContent = "¡Te quiero muchísimo! 🥰";
            ojoIzq.className = "ojo izq";
            ojoDer.className = "ojo der";
            kitty.style.animation = "respirar 3s ease-in-out infinite";
        }

        function lanzarEfecto(emoji) {
            const el = document.createElement('div');
            el.classList.add('efecto-visual');
            el.textContent = emoji;
            
            // Posicionamiento flotante aleatorio
            const x = Math.random() * (escenario.offsetWidth - 100) + 50;
            const y = escenario.offsetHeight / 2;
            
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            
            escenario.appendChild(el);
            setTimeout(() => el.remove(), 1500);
        }
    </script>
</body>
</html>
